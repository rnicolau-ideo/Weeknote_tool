<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Name — Week 01</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f4f0;font-family:'Manrope', sans-serif;color:#1a1a18;}
.wrap{max-width:620px;margin:0 auto;background:#ffffff;}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div style="width:100%;position:relative;height:280px;background:#1a1a18;">
    <div style="position:absolute;top:0;left:0;right:0;padding:22px 36px;display:flex;align-items:baseline;justify-content:space-between;z-index:2;">
      <div style="font-family:'FH Oscar', Georgia, serif;font-style:italic;font-weight:700;font-size:22px;color:#ffffff;text-shadow:0 1px 6px rgba(0,0,0,.4);">Project Name</div>
      <div style="font-family:'Geist Mono', monospace;font-size:10px;color:rgba(255,255,255,.85);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.3);">Week 01</div>
    </div>
  </div>

  <!-- WELCOME -->
  <div style="padding:48px 48px 36px;border-bottom:1px solid #e8e6df;">
    <div style="font-family:'Geist Mono', monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888780;margin-bottom:18px;">Week 01</div>
    <div style="font-family:'FH Oscar', Georgia, serif;font-style:italic;font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-0.5px;color:#1a1a18;margin-bottom:18px;">test</div>
    <p style="font-family:'Manrope', sans-serif;font-size:15px;color:#444441;">Intro goes here.</p>
  </div>

  <!-- WHAT WE DID -->
  <div style="padding:44px 48px 36px;">
    <div style="font-family:'Geist Mono', monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888780;margin-bottom:24px;">What we got up to</div>
    <ul style="list-style:none;">
      <li style="font-family:'Manrope', sans-serif;font-size:15px;font-weight:400;line-height:1.8;color:#444441;padding:10px 0;border-top:0.5px solid #e8e6df;display:flex;align-items:flex-start;gap:12px;">
      <span style="width:5px;height:5px;border-radius:50%;background:#1a1a18;flex-shrink:0;margin-top:10px;display:inline-block;"></span>
      <span>No updates yet.</span>
    </li>
    </ul>
    
  </div>

  <!-- COMING NEXT -->
  <div style="padding:44px 48px 36px;border-top:1px solid #e8e6df;border-bottom:1px solid #e8e6df;background:#f9f8f4;">
    <div style="display:flex;gap:32px;align-items:flex-start;">
      <div style="font-family:'Geist Mono', monospace;font-size:10px;letter-spacing:.12em;color:#888780;text-transform:uppercase;white-space:nowrap;padding-top:2px;min-width:80px;">Coming next</div>
      <div>
        <p style="font-family:'Manrope', sans-serif;font-size:14px;color:#888780;">Coming soon.</p>
      </div>
    </div>
  </div>

  <!-- SIGN OFF -->
  <div style="padding:52px 48px 44px;background:#1a1a18;">
    <div style="font-family:'FH Oscar', Georgia, serif;font-style:italic;font-weight:700;font-size:30px;line-height:1.15;color:#f5f4f0;margin-bottom:20px;letter-spacing:-0.3px;">See you next week!</div>
    <div style="font-family:'Manrope', sans-serif;font-size:13px;font-weight:400;color:rgba(255,255,255,0.45);line-height:1.6;">The team</div>
  </div>

  <!-- FOOTER STRIP -->
  <div style="height:6px;background:#f9f8f4;"></div>

</div>
</body>
</html>
